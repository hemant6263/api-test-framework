[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actf"
version = "0.1.0"
description = "API test framework — YAML-driven, chainable API tests"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonpath-ng>=1.6",
    "jsonpath-python>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "respx>=0.21"]
allure = ["allure-pytest>=2.13"]
sso = ["playwright>=1.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Live suites mutate a real environment (they create and delete users), so a
# bare `pytest` must not fire them by accident. Opt in with `-m live`.
addopts = "-q -m 'not live'"
markers = ["live: hits a real environment; needs AC_TOKEN"]
