# Create a product, find it via server-side name filter, delete it, verify gone.
#
# Run: AC_TOKEN=<key> .venv/bin/python -m pytest tests/test_suites.py -m live -k Product
#
# Endpoints (verified against authserver):
#   POST   /user/product              ProductController @RequestMapping("/user/product")
#                                     -> ProductResponseDto, FLAT (no wrapper)
#   POST   /api/product               ProductApiController @RequestMapping("/api/product")
#                                     -> BaseResponseDto<Page<ProductResponseDto>>
#                                        i.e. { data: { content: [...] }, success: true }
#                                     NOTE: this is a POST because the filter is a body.
#   DELETE /user/product/{id}?delete=true   hard delete (default is soft archive)
#
# Why POST /api/product and not GET /user/product/v2: the /api one filters
# server-side by name, so this suite never depends on the new product landing
# on page 0 of an unfiltered list.
name: Product - create then list
tags: [smoke, products]
env: qa

auth:
  type: bearer

vars:
  # Unique per run: name is @NotBlank @Size(min=2,max=228) and must be unique
  # within the business unit ("Name already exists" otherwise).
  productName: "apitest-prod-${uuid}"

steps:

  # 1. CREATE — only `name` is required on ProductReqDto; the business unit comes
  #    from the session (sending businessUnitId explicitly is actually rejected
  #    for non-token users). Response is flat, NOT wrapped.
  - name: create product
    request:
      method: POST
      path: /user/product
      headers:
        Content-Type: application/json
      body:
        name: "${productName}"
        description: "created by actf api test"
    expect:
      status: 200
      assertions:
        - { path: "$.id",   notNull: true }
        - { path: "$.id",   type: number }
        - { path: "$.name", eq: "${productName}" }
    capture:
      productId: "$.id"

  # 2. LIST with a server-side name filter. `name` is a List<String> matched
  #    case-insensitively and EXACTLY (not a LIKE), so one row comes back.
  #    Page size max is 100 — 101+ returns 400 "Page size cannot be greater than 100".
  - name: find the product by name filter
    request:
      method: POST
      path: /api/product
      headers:
        Content-Type: application/json
      query:
        page: 0
        size: 100
      body:
        name: ["${productName}"]
        disableRiscScore: true      # skip risk-score computation; faster and irrelevant here
    expect:
      status: 200
      assertions:
        - { path: "$.success", eq: true }
        # exactly one hit — not "at least one"
        - { path: "$.data.totalElements",     eq: 1 }
        - { path: "$.data.content",           size: 1 }
        # and it is OUR product: the id must match what create returned
        - { path: "$.data.content[0].id",   eq: "${productId}" }
        - { path: "$.data.content[0].name", eq: "${productName}" }

  # 3. FETCH BY ID — proves the product is individually retrievable, not just
  #    present in a list projection.
  - name: fetch the product by id
    request:
      method: GET
      path: "/user/product/${productId}"
    expect:
      status: 200
      assertions:
        - { path: "$.id",   eq: "${productId}" }
        - { path: "$.name", eq: "${productName}" }

  # 4. DELETE — returns void, so assert on status only.
  #    delete=true is a HARD delete; without it the product is soft-archived
  #    (status DELETED, moved to an archive BU) and would linger.
  - name: delete product
    request:
      method: DELETE
      path: "/user/product/${productId}"
      query:
        delete: true
    expect:
      status: 200

  # 5. VERIFY GONE — deletion is ASYNCHRONOUS. The DELETE above returns 200 as
  #    soon as the job is accepted, not when it finishes: an immediate search
  #    still finds the product, and a second DELETE reports "Previous delete
  #    operation is in progress". So poll until the product actually disappears.
  - name: verify product no longer found
    request:
      method: POST
      path: /api/product
      headers:
        Content-Type: application/json
      body:
        name: ["${productName}"]
        disableRiscScore: true
    retry: { until: pass, timeout: 60s, interval: 3s }
    expect:
      status: 200
      assertions:
        - { path: "$.data.totalElements", eq: 0 }
        - { path: "$.data.content",       isEmpty: true }

# Safety net: only matters if step 4 never ran because an earlier step failed.
# On the happy path the product is already deleted by the time we get here, so a
# 4xx ("Previous delete operation is in progress" / not found) is expected and
# does not fail the suite.
cleanup:
  - name: remove test product if still present
    request:
      method: DELETE
      path: "/user/product/${productId}"
      query:
        delete: true
