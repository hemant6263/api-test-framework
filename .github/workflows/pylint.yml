name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,allure]"
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        # Fail only on real problems (undefined names, import errors, etc).
        # Disabled, all intentional patterns rather than bugs:
        #  C,R              docstrings / design metrics — not a convention here
        #  W0613            unused-argument — Matcher/Extractor/Evaluator
        #                    interface methods and pytest fixtures don't use
        #                    every parameter by design
        #  W0718            broad-exception-caught — deliberate top-level
        #                    catch-alls in the suite runner
        #  W0123            eval-used — the documented `allow_inline` escape
        #                    hatch (see README "Inline expressions")
        #  W0212            protected-access — test-only introspection of
        #                    internals
        #  W0611            unused-import — pytest/json imported in tests for
        #                    fixture/monkeypatch side effects
        #  W1514            unspecified-encoding — test fixture files only
        #  W0621            redefined-outer-name — pytest fixture shadowing,
        #                    the standard pytest pattern
        pylint --disable=C,R,W0613,W0718,W0123,W0212,W0611,W1514,W0621 $(git ls-files '*.py')
